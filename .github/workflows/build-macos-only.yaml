name: build-macos-only

on:
  workflow_dispatch:
  push:
    branches:
      - macos-battery-fix
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Match upstream FlClash 0.8.94 CI.
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Match upstream FlClash 0.8.94 (pubspec deps need this Dart SDK).
          flutter-version: '3.44.4'
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build DMG
        run: dart setup.dart macos -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-macos-arm64-dmg
          path: ./dist
          overwrite: true

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd ./dist
          shasum -a 256 * > SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body: |
            macOS (Apple Silicon) build on top of upstream FlClash 0.8.94, plus extra Dart idle-CPU fixes.

            Includes upstream 0.8.94:
            - Updated ClashMeta/mihomo core
            - Official tray_manager native redraw-loop fix (SpeedTextView)

            Extra fixes retained from this fork:
            - Tray title updates are deduplicated (no more per-second setTitle)
            - Per-second core polling is paused while the window is hidden
            - High-frequency IPC calls no longer flood the log list
            - Connection push messages are not parsed while the window is hidden

            See MACOS_PERFORMANCE_FIX.md in the repository for full details.

            **Install note:** this build is unsigned. After copying FlClash.app to /Applications, run:
            `xattr -rd com.apple.quarantine /Applications/FlClash.app`
